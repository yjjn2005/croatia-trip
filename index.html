:root{

:root[data-theme="dark"]{

html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 84px}
.wrap{max-width:960px;margin-inline:auto}
header{padding-block:20px 8px}

h3{font-size:1rem;margin:0 0 4px}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}

.chip{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--sea-soft);color:var(--sea);font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.stone{background:var(--stone-soft);color:var(--stone)}

nav.tabs button[aria-selected="true"]{color:var(--sea);background:var(--sea-soft);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
section.panel{display:flex;flex-direction:column;gap:14px;padding-block:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.notice{border-radius:8px;padding:10px 12px;font-size:.88rem;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}

.route{display:flex;flex-direction:column;gap:0}
.stop{display:grid;grid-template-columns:20px 1fr;gap:10px}
.stop .rail{display:flex;flex-direction:column;align-items:center}
.stop .dot{width:14px;height:14px;border-radius:50%;background:var(--sea);margin-top:6px;flex:none}
.stop .line{flex:1;width:2px;background:var(--line);min-height:20px}
.stop:last-child .line{display:none}
.stop .body{padding-bottom:16px;min-width:0}
.stop .d{font-weight:700;color:var(--sea);font-size:.85rem}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.leg{padding:10px;border-radius:8px;background:var(--stone-soft);font-size:.88rem}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}

.days button[aria-pressed="true"],.filters button[aria-pressed="true"]{background:var(--sea);color:var(--surface);border-color:var(--sea)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.slot{display:grid;grid-template-columns:72px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .t{font-size:.8rem;color:var(--muted);font-weight:500}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin:2px 0}
input[type=search],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.place{display:flex;flex-direction:column;gap:6px}
.place .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:.85rem;border:1px solid var(--sea);color:var(--sea);background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.solid{background:var(--sea);color:var(--surface)} .btn.stone{border-color:var(--stone);color:var(--stone)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--sea)}
.check label{flex:1;min-width:0}
.check small{display:block;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden} .prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.8rem}
.scroll{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:9}
.themebtn{float:right;font-size:.78rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){nav.tabs{justify-content:center;gap:6px} nav.tabs button{max-width:150px}}
